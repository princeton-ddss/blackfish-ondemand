title: "Blackfish"
description: >-
  Launches a per-user Blackfish AI model-serving server, from a shared
  installation, on a login/visualization node selected as the Open OnDemand
  cluster target (not submitted as a Slurm batch job to a compute node).
  Users pick a site-provisioned Blackfish version, an application home
  directory, and a session duration; sites configure the cluster, shared
  cache, installations, modules, and optional duration limits without
  editing application code.
software: "Blackfish"
app_type: "batch-connect-basic"
implementation_tags:
